<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Cutter</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <h1>🎬 Video Cutter</h1>
  <div class="topbar-actions">
    <button id="btnShowLog" class="btn btn-ghost">Ver log</button>
    <button id="btnOpenLogFolder" class="btn btn-ghost">Abrir pasta do log</button>
  </div>
</header>

<main class="app">

  <!-- COLUNA ESQUERDA: seleção de vídeo + player + timeline -->
  <section class="panel panel-main">

    <div id="pickBox" class="upload-box">
      <button id="btnChooseFile" class="btn btn-primary">Selecionar vídeo...</button>
      <span id="pickStatus" class="upload-status">Nenhum vídeo carregado</span>
    </div>

    <div id="playerWrap" class="player-wrap hidden">
      <video id="videoPlayer" controls></video>

      <div class="timeline-wrap">
        <div class="timeline-times">
          <span id="tlCurrent">00:00</span>
          <span id="tlDuration">00:00</span>
        </div>

        <div id="timeline" class="timeline">
          <div id="tlProgress" class="tl-progress"></div>
          <div id="tlSelection" class="tl-selection"></div>
          <div id="tlHandleStart" class="tl-handle tl-handle-start" title="Arraste para ajustar início"></div>
          <div id="tlHandleEnd" class="tl-handle tl-handle-end" title="Arraste para ajustar fim"></div>
          <div id="tlPlayhead" class="tl-playhead"></div>
        </div>

        <div class="mark-controls">
          <button id="btnMarkIn" class="btn btn-small">Marcar início (I)</button>
          <button id="btnMarkOut" class="btn btn-small">Marcar fim (O)</button>
          <span class="mark-readout">
            Seleção: <strong id="markInLabel">00:00.00</strong> → <strong id="markOutLabel">00:00.00</strong>
            (<span id="markDurLabel">0.00s</span>)
          </span>
        </div>
      </div>

      <div class="batch-row">
        <label class="checkbox-label">
          <input type="checkbox" id="batchToggle">
          Batch cutting
        </label>
        <div id="batchOptions" class="batch-options hidden">
          <label for="batchSeconds">Duração de cada pedaço (segundos):</label>
          <input type="number" id="batchSeconds" min="1" step="1" value="20">
        </div>
      </div>

      <div class="add-cut-row">
        <button id="btnAddCut" class="btn btn-primary">+ Adicionar corte à lista</button>
        <label class="checkbox-label reencode-label" title="Desmarcado usa 'stream copy' (bem mais rápido), mas o corte pode escorregar até ~1 keyframe (geralmente alguns segundos). Marcado reprocessa o vídeo e garante o tempo exato pedido.">
          <input type="checkbox" id="reencodeToggle" checked>
          Corte preciso (reencode) — recomendado
        </label>
      </div>
    </div>

  </section>

  <!-- COLUNA DIREITA: lista de cortes + destino + exportar -->
  <section class="panel panel-side">
    <h2>Cortes marcados</h2>
    <ul id="cutsList" class="cuts-list">
      <li class="cuts-empty">Nenhum corte adicionado ainda.</li>
    </ul>

    <div class="output-folder-row">
      <button id="btnChooseFolder" class="btn btn-small">Escolher pasta de destino...</button>
      <span id="outputFolderLabel" class="output-folder-label">Padrão (pasta "exports" do programa)</span>
    </div>

    <button id="btnExport" class="btn btn-export" disabled>Exportar tudo</button>

    <div id="exportResult" class="export-result hidden">
      <h3>Exportação concluída</h3>
      <p id="exportSummary"></p>
      <button id="btnOpenExportFolder" class="btn btn-primary">Abrir pasta dos cortes</button>
      <ul id="exportFilesList" class="export-files-list"></ul>
    </div>

    <div id="statusBox" class="status-box"></div>
  </section>

</main>

<!-- Modal de log -->
<div id="logModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>cortes_log.txt</h3>
      <button id="btnCloseLog" class="btn btn-ghost">Fechar</button>
    </div>
    <pre id="logContent" class="log-content"></pre>
  </div>
</div>

<script type="text/javascript" src="/eel.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
